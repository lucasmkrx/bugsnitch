services:
  db:
    image: postgres:17.12-alpine
    environment:
      POSTGRES_DB: bugsnitch
      POSTGRES_USER: bugsnitch
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set a random database password}
    volumes:
      - data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U bugsnitch]
      interval: 5s
      timeout: 3s
      retries: 15
  server:
    build: {context: .., dockerfile: deploy/Dockerfile}
    restart: unless-stopped
    depends_on: {db: {condition: service_healthy}}
    ports: ["127.0.0.1:${BUGSNITCH_HOST_PORT:-8787}:8787"]
    environment:
      BUGSNITCH_ORIGIN: ${BUGSNITCH_ORIGIN:-http://localhost:8787}
      BUGSNITCH_OWNER_TOKEN: ${BUGSNITCH_OWNER_TOKEN:?set an owner credential}
      BUGSNITCH_RECAPTCHA_PROJECT: ${BUGSNITCH_RECAPTCHA_PROJECT:-}
      BUGSNITCH_RECAPTCHA_SITE_KEY: ${BUGSNITCH_RECAPTCHA_SITE_KEY:-}
      BUGSNITCH_RESEND_API_KEY: ${BUGSNITCH_RESEND_API_KEY:-}
      BUGSNITCH_EMAIL_FROM: ${BUGSNITCH_EMAIL_FROM:-}
      BUGSNITCH_EMAIL_CODE_KEY: ${BUGSNITCH_EMAIL_CODE_KEY:-}
      BUGSNITCH_MCP_TOKEN: ${BUGSNITCH_MCP_TOKEN:-}
      BUGSNITCH_MCP_SCOPES: ${BUGSNITCH_MCP_SCOPES:-}
      MCP_OAUTH_ISSUER: ${MCP_OAUTH_ISSUER:-}
      MCP_OAUTH_INTROSPECTION: ${MCP_OAUTH_INTROSPECTION:-}
      MCP_OAUTH_CLIENT_ID: ${MCP_OAUTH_CLIENT_ID:-}
      MCP_OAUTH_CLIENT_SECRET: ${MCP_OAUTH_CLIENT_SECRET:-}
      MCP_OAUTH_OWNER_SUBJECT: ${MCP_OAUTH_OWNER_SUBJECT:-}
      SENTRY_CLIENT_SECRET: ${SENTRY_CLIENT_SECRET:-}
      BUGSNITCH_GITHUB_INSTALLATION_ID: ${BUGSNITCH_GITHUB_INSTALLATION_ID:-}
      LINEAR_WEBHOOK_SECRET: ${LINEAR_WEBHOOK_SECRET:-}
      BUGSNITCH_LINEAR_AGENT_TOKEN: ${BUGSNITCH_LINEAR_AGENT_TOKEN:-}
      SLACK_SIGNING_SECRET: ${SLACK_SIGNING_SECRET:-}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
      BUGSNITCH_GITHUB_QUEUE_REPOSITORIES: ${BUGSNITCH_GITHUB_QUEUE_REPOSITORIES:-}
      BUGSNITCH_LINEAR_API_KEY: ${BUGSNITCH_LINEAR_API_KEY:-}
      DATABASE_URL: postgresql://bugsnitch:${POSTGRES_PASSWORD}@db/bugsnitch?sslmode=disable
volumes:
  data:
