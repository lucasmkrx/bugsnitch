name: Feature proposal
description: Propose an improvement to development coordination
body:
  - type: textarea
    id: problem
    attributes: { label: What delivery problem are you trying to solve? }
    validations: { required: true }
  - type: textarea
    id: proposal
    attributes: { label: Proposed behavior }
    validations: { required: true }
  - type: textarea
    id: alternatives
    attributes: { label: Alternatives and tradeoffs }
