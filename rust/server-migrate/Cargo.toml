[package]
name = "bugsnitch-server-migrate"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
libpq = "=6.0.1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio", "matched-path"] }
bytes = "1"
getrandom = "0.4"
hex = "0.4"
hmac = "0.12"
httpdate = "1"
tokio-io-timeout = "1"
http-range = "0.1.6"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
percent-encoding = "2"
rustix = { version = "1", features = ["fs"] }
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "service"] }
mime_guess = "2"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots", "stream"] }
rmcp = { version = "=3.11.0", default-features = false, features = ["server", "transport-streamable-http-server"] }
sha2 = "0.10"
subtle = "2"
tempfile = "3"
time = { version = "0.3", features = ["formatting", "parsing"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "signal", "sync", "time", "process", "io-util"] }
tower = { version = "0.5", features = ["util"] }
url = "2"
