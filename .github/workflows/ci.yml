name: CI
on: [push, pull_request]
permissions: {contents: read}
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.12-alpine
        env: {POSTGRES_PASSWORD: test, POSTGRES_DB: bugsnitch_test}
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      BUGSNITCH_TEST_DSN: postgres://postgres:test@localhost:5432/bugsnitch_test?sslmode=disable
      BUGSNITCH_TEST_DATABASE_URL: postgres://postgres:test@localhost:5432/bugsnitch_test?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with: {go-version: '1.27.4'}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: {node-version-file: .nvmrc, cache: npm, cache-dependency-path: web/package-lock.json}
      - run: sudo apt-get update && sudo apt-get install -y libpq-dev libclang-dev sqlite3 bubblewrap
      - run: cargo fmt --all -- --check
      - run: make test GO_TEST_FLAGS="-race -count=1"
        env:
          BUGSNITCH_TEST_ISOLATED_VALIDATOR: "1"
      - run: cargo test --locked -p bugsnitch-server-migrate --test database -- --ignored
      - run: make build plugin
      - name: Exercise the packaged Rust HTTP server and provider protocols
        env:
          PGHOST: localhost
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: test
        run: |
          python3 scripts/smoke-devices.py
          python3 scripts/smoke-server-lifecycle.py
          python3 scripts/smoke_inbound.py
          python3 scripts/smoke.py
      - run: npm --prefix web run test:browser
      - run: node --test examples/checkout/telemetry.test.mjs
      - run: make checkout-acceptance
      - name: Verify two isolated hosted pilot instances
        env:
          POSTGRES_PASSWORD: ephemeral-ci-db
          BUGSNITCH_OWNER_TOKEN: ephemeral-ci-only-owner-token-000000000000
          BUGSNITCH_SECOND_OWNER_TOKEN: ephemeral-ci-second-owner-token-000000000000
        run: |
          first() {
            docker compose --project-name bugsnitch-ci-first -f deploy/compose.yml "$@"
          }
          second() {
            POSTGRES_PASSWORD=ephemeral-ci-second-db BUGSNITCH_OWNER_TOKEN="$BUGSNITCH_SECOND_OWNER_TOKEN" \
              BUGSNITCH_HOST_PORT=8788 BUGSNITCH_ORIGIN=http://localhost:8788 \
              docker compose --project-name bugsnitch-ci-second -f deploy/compose.yml "$@"
          }
          cleanup() {
            first down --volumes
            second down --volumes
          }
          trap cleanup EXIT
          first up --build --detach
          second up --build --detach
          for port in 8787 8788; do
            if ! curl --fail --silent --show-error --retry 20 --retry-delay 2 --retry-all-errors --max-time 3 --retry-max-time 50 "http://localhost:$port/readyz"; then
              first logs --tail 20 server
              second logs --tail 20 server
              exit 1
            fi
          done
          python3 scripts/smoke-pilot.py http://localhost:8787 http://localhost:8788
  macos-runner:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: macos-15, arch: arm64}
          - {runner: macos-15-intel, arch: amd64}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with: {go-version: '1.27.4'}
      - name: Build and exercise the native runner package
        env:
          BUGSNITCH_PACKAGE_ARCH: ${{ matrix.arch }}
          BUGSNITCH_TEST_ISOLATED_VALIDATOR: "1"
        run: |
          make "macos-$BUGSNITCH_PACKAGE_ARCH"
          package_dir=$(mktemp -d)
          tar -xzf "bin/packages/bugsnitch-runner-darwin-$BUGSNITCH_PACKAGE_ARCH.tar.gz" -C "$package_dir"
          BUGSNITCH_HOME="$package_dir/profile" "$package_dir/bugsnitch" local-list
          BUGSNITCH_JOURNAL_HELPER="$package_dir/bugsnitch-runner-journal" go test -count=1 ./internal/runner
          "$package_dir/runner-service" install "$package_dir/bugsnitch"
