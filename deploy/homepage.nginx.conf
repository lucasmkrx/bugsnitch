server {
    listen 8080;
    absolute_redirect off;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types application/javascript application/json image/svg+xml text/css;
    add_header X-Content-Type-Options nosniff always;

    if ($request_method !~ ^(GET|HEAD)$) {
        return 405;
    }

    # The public workspace reads the same synthetic fixture as the local demo.
    location = /api/v1/state {
        types { }
        default_type application/json;
        alias /usr/share/bugsnitch/workspace.json;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
