name: Bug report
description: Report a reproducible problem in Bugsnitch
body:
  - type: markdown
    attributes:
      value: Redact credentials and private repository content. Use [private security reporting](https://github.com/lucasmkrx/bugsnitch/security/advisories) for suspected vulnerabilities.
  - type: input
    id: bugsnitch
    attributes:
      label: Bugsnitch commit or version
      description: When running from source, include the output of `git rev-parse --short HEAD`.
    validations: { required: true }
  - type: input
    id: component
    attributes:
      label: Affected component
      description: For example, the dashboard, macOS runner, self-hosted server, or a provider integration.
    validations: { required: true }
  - type: input
    id: os
    attributes: { label: Operating system and version }
    validations: { required: true }
  - type: input
    id: git
    attributes: { label: Git version }
  - type: textarea
    id: steps
    attributes:
      {
        label: Reproduction steps,
        description: Use a minimal disposable repository when possible.,
      }
    validations: { required: true }
  - type: textarea
    id: expected
    attributes: { label: Expected result }
    validations: { required: true }
  - type: textarea
    id: actual
    attributes: { label: Actual result }
    validations: { required: true }
  - type: textarea
    id: logs
    attributes:
      {
        label: Relevant messages or logs,
        description: Redact credentials and private repository content.,
      }
