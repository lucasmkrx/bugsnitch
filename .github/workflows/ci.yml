name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    name: validate (${{ matrix.os }}, VS Code ${{ matrix.vscode }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        vscode: ['1.105.0']
        include:
          - os: ubuntu-latest
            vscode: stable
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test:coverage
      - run: pnpm validate:release
      - run: pnpm build
      - name: Test inside VS Code
        env:
          BUGSNITCH_TEST_VSCODE_VERSION: ${{ matrix.vscode }}
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a pnpm test:extension
          else
            pnpm test:extension
          fi
      - name: Test checked installed package
        env:
          BUGSNITCH_TEST_VSCODE_VERSION: ${{ matrix.vscode }}
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a pnpm test:package
          else
            pnpm test:package
          fi
      - name: Test production browser
        if: matrix.os == 'ubuntu-latest' && matrix.vscode == '1.105.0'
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm test:browser
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: matrix.os == 'ubuntu-latest' && matrix.vscode == '1.105.0' && always()
        with:
          name: validation-reports
          path: |
            coverage/
            playwright-report/
            .cache/package-validation.json
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: matrix.os == 'ubuntu-latest' && matrix.vscode == '1.105.0'
        with:
          name: bugsnitch-vsix
          path: apps/vscode/*.vsix
          if-no-files-found: error
          retention-days: 14
  check:
    needs: validate
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every validation job to pass
        env:
          VALIDATION_RESULT: ${{ needs.validate.result }}
        run: test "$VALIDATION_RESULT" = success
